<section class="hero is-fullheight has-text-centered" id="hero">
  <div class="hero-body">
    <div class="container">
      <h1 class="title hero-brand-title">
        <img
          class="hero-brand-logo"
          src="{{ site.url }}{{ site.baseurl }}/assets/images/muniqai-logo-white-hero.png"
          alt="{{ site.title }}"
        >
      </h1>
      <h3 class="subtitle has-text-white-bis is-uppercase has-text-weight-medium is-marginless">
        {{ site.description | newline_to_br }}
      </h3>
      <hr>
      <a href="{{site.url}}{{site.baseurl}}/#about"
        class="button is-white is-rounded is-outlined is-uppercase has-text-weight-normal">About Us</a>
      </a>
    </div>
  </div>
</section>
