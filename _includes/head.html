<head>
    {% include meta.html %}
    <title>{{site.title}}</title>
    {% if site.github.build_revision %}
    {% assign css_version = site.github.build_revision %}
    {% else %}
    {% assign css_version = site.time | date: '%s' %}
    {% endif %}
    <link rel="stylesheet" href="{% if site.baseurl %}{{site.baseurl}}{% else %}{% endif %}/assets/css/style.css?v={{ css_version }}">
    <script src="https://kit.fontawesome.com/6a97161b76.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="{% if site.favicon-url %}{{site.favicon-url}}{% else %}{{ 'assets/images/logo.png' | absolute_url }}{% endif %}" type="image/x-icon">
</head>
